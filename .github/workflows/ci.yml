name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # agental-sdk is published to npm from here, by npm's trusted publishing (no token is kept):
  # a push to main whose package.json has a version npm does not have yet publishes it, with
  # provenance, once the tests above passed. That push is the mirror's, which Deploy runs in
  # agental's own repository only once a release is deployed, so the package never runs ahead
  # of the API it calls. A version is bumped in the pull request that changes the SDK there.
  publish:
    needs: test
    # Only the mirror's push, which Deploy makes once a release is deployed: a push to main
    # made here by hand publishes nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Sync with agental v')
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.2

      - name: Publish the version npm does not have yet
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null || true)" ]; then
            echo "${name}@${version} is on npm already: nothing to publish."
            exit 0
          fi
          npm ci
          npm publish --access public
          echo "Published ${name}@${version}."
